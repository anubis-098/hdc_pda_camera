services:
  pda-camera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pda-camera
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8090
      HOST: 0.0.0.0
      HTTPS_ENABLED: "false"
      STORAGE_ROOT: /data/uploads
    volumes:
      - type: bind
        source: ${STORAGE_HOST_PATH:-./uploads}
        target: /data/uploads
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_interval: 1s
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      pda-camera:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COMPOSE_HTTP_PORT:-8083}:443"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HDC_TLS_DIRECTORY:-D:/HDC-Certificates}/hdc-server.crt
        target: /etc/nginx/certs/hdc-server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HDC_TLS_DIRECTORY:-D:/HDC-Certificates}/hdc-server.key
        target: /etc/nginx/certs/hdc-server.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_interval: 1s
      start_period: 10s
