<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f4f4">
    <title>PDA Camera Upload</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="camera-shell">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="captureCanvas" hidden></canvas>
        <img id="preview" alt="Preview">
        <div class="crop-guide" id="cropGuide" aria-hidden="true"></div>

        <div class="overlay overlay-top">
          <button id="galleryBtn" class="btn btn-icon btn-glass top-icon" type="button" aria-label="Open gallery" title="Open gallery">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect>
              <circle cx="8.5" cy="9" r="1.3"></circle>
              <path d="m4.5 17 4.2-4.2 3.1 3.1 2.2-2.2 5.5 5.5"></path>
            </svg>
          </button>
          <div class="destination-chip">
            <label for="destinationSelect">Save to</label>
            <select id="destinationSelect" aria-label="Save image to folder">
              <option value="Return">Return</option>
              <option value="Outbound">Outbound</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div id="networkStatus" class="pill">Idle</div>
        </div>

        <div class="overlay overlay-bottom" id="liveControls">
          <button id="settingsBtn" class="btn btn-icon btn-glass" type="button" aria-label="Open settings" title="Open settings">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5 21 19H3Z"></path>
              <path d="M12 9v4.5"></path>
              <circle cx="12" cy="16.5" r=".7"></circle>
            </svg>
          </button>
          <button id="captureBtn" class="btn btn-capture" type="button" disabled aria-label="Capture image" title="Capture image">
            <span class="capture-core" aria-hidden="true">
              <svg class="capture-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.5 8.5h2l1.2-1.8h2.6l1.2 1.8h2a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16v-5a2.5 2.5 0 0 1 2.5-2.5Z"></path>
                <circle cx="12" cy="13.5" r="3"></circle>
              </svg>
            </span>
          </button>
          <button id="switchBtn" class="btn btn-icon btn-glass" type="button" aria-label="Switch camera" title="Switch camera">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 0 0-14.9-3"></path>
              <path d="M4 4v5h5"></path>
              <path d="M4 13a8 8 0 0 0 14.9 3"></path>
              <path d="M20 20v-5h-5"></path>
            </svg>
          </button>
        </div>

        <div class="overlay overlay-settings hidden" id="settingsPanel">
          <div class="settings-card">
            <div class="settings-title">Camera Settings</div>
            <label class="settings-field">
              <span>Resolution</span>
              <select id="resolutionSelect">
                <option value="1920x1080">1920 x 1080</option>
                <option value="1280x720">1280 x 720</option>
                <option value="1024x768">1024 x 768</option>
              </select>
            </label>
            <label class="settings-field">
              <span>Ratio</span>
              <select id="ratioSelect">
                <option value="9:16">9 : 16</option>
                <option value="3:4">3 : 4</option>
                <option value="4:3">4 : 3</option>
                <option value="1:1">1 : 1</option>
              </select>
            </label>
            <div class="settings-field">
              <span>Zoom</span>
              <div class="zoom-options" role="group" aria-label="Camera zoom">
                <button class="zoom-btn is-active" type="button" data-zoom="1">x1</button>
                <button class="zoom-btn" type="button" data-zoom="2">x2</button>
                <button class="zoom-btn" type="button" data-zoom="3">x3</button>
              </div>
            </div>
          </div>
        </div>

        <section class="gallery-panel hidden" id="galleryPanel" aria-label="Image gallery">
          <div class="gallery-card">
            <div class="gallery-header">
              <strong>Gallery</strong>
              <button id="galleryCloseBtn" class="btn btn-icon gallery-close" type="button" aria-label="Close gallery" title="Close gallery">
                <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6 18 18"></path>
                  <path d="M18 6 6 18"></path>
                </svg>
              </button>
            </div>
            <div class="gallery-toolbar">
              <select id="galleryDestinationSelect" aria-label="Gallery folder">
                <option value="Return">Return</option>
                <option value="Outbound">Outbound</option>
                <option value="Other">Other</option>
              </select>
              <button id="galleryRefreshBtn" class="btn btn-icon gallery-refresh" type="button" aria-label="Refresh gallery" title="Refresh gallery">
                <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 11a8 8 0 0 0-14.9-3"></path>
                  <path d="M4 4v5h5"></path>
                  <path d="M4 13a8 8 0 0 0 14.9 3"></path>
                  <path d="M20 20v-5h-5"></path>
                </svg>
              </button>
            </div>
            <div class="gallery-status" id="galleryStatus"></div>
            <div class="gallery-grid" id="galleryGrid"></div>
          </div>
        </section>

        <div class="image-viewer hidden" id="imageViewer">
          <button id="imageViewerCloseBtn" class="btn btn-icon image-viewer-close" type="button" aria-label="Close image" title="Close image">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 18 18"></path>
              <path d="M18 6 6 18"></path>
            </svg>
          </button>
          <img id="imageViewerImage" alt="Full size image">
        </div>

        <div class="overlay overlay-preview hidden" id="previewPanel">
          <div class="preview-actions">
            <button id="confirmBtn" class="btn btn-stack btn-confirm" type="button" aria-label="Confirm upload">
              <svg class="stack-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 12 4.2 4.2L19 6.5"></path>
              </svg>
              <span>Confirm</span>
            </button>
            <button id="cancelBtn" class="btn btn-stack btn-cancel" type="button" aria-label="Cancel capture">
              <svg class="stack-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6 18 18"></path>
                <path d="M18 6 6 18"></path>
              </svg>
              <span>Cancel</span>
            </button>
          </div>
          <div class="preview-meta">
            <div id="captureStats">No image</div>
            <div id="serverResult"></div>
          </div>
        </div>

        <div class="overlay overlay-message">
          <div id="liveHint">Align item and tap capture</div>
        </div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
  </html>
