<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f4f4">
    <title>PDA Camera Upload</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="camera-shell">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="captureCanvas" hidden></canvas>
        <img id="preview" alt="Preview">
        <div class="crop-guide" id="cropGuide" aria-hidden="true"></div>

        <div class="overlay overlay-top">
          <div id="networkStatus" class="pill" aria-label="Idle" title="Idle">Idle</div>
          <div class="destination-chip">
            <label for="destinationSelect" data-i18n="saveTo">Save to</label>
            <select id="destinationSelect" aria-label="Save image to folder">
              <option value="Return" data-i18n="returnFolder">Return</option>
              <option value="Outbound" data-i18n="outboundFolder">Outbound</option>
              <option value="Other" data-i18n="otherFolder">Other</option>
            </select>
          </div>
          <button id="settingsBtn" class="btn btn-icon btn-glass top-icon" type="button" aria-label="Open settings" title="Open settings">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 6.3a4.5 4.5 0 0 0-5.9 5.9l-4.6 4.6a2.1 2.1 0 0 0 3 3l4.6-4.6a4.5 4.5 0 0 0 5.9-5.9l-2.5 2.5-2.8-.7-.7-2.8Z"></path>
            </svg>
          </button>
        </div>

        <div class="overlay overlay-bottom" id="liveControls">
          <button id="galleryBtn" class="btn btn-icon btn-glass" type="button" aria-label="Open gallery" title="Open gallery">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect>
              <circle cx="8.5" cy="9" r="1.3"></circle>
              <path d="m4.5 17 4.2-4.2 3.1 3.1 2.2-2.2 5.5 5.5"></path>
            </svg>
          </button>
          <button id="captureBtn" class="btn btn-capture" type="button" disabled aria-label="Capture image" title="Capture image">
            <span class="capture-core" aria-hidden="true">
              <svg class="capture-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.5 8.5h2l1.2-1.8h2.6l1.2 1.8h2a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16v-5a2.5 2.5 0 0 1 2.5-2.5Z"></path>
                <circle cx="12" cy="13.5" r="3"></circle>
              </svg>
            </span>
          </button>
          <button id="switchBtn" class="btn btn-icon btn-glass" type="button" aria-label="Switch camera" title="Switch camera">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 0 0-14.9-3"></path>
              <path d="M4 4v5h5"></path>
              <path d="M4 13a8 8 0 0 0 14.9 3"></path>
              <path d="M20 20v-5h-5"></path>
            </svg>
          </button>
        </div>

        <div class="overlay overlay-settings hidden" id="settingsPanel">
          <div class="settings-card">
            <div class="settings-title-row">
              <div class="settings-title" data-i18n="cameraSettings">Camera Settings</div>
              <button id="deviceInfoBtn" class="btn info-btn" type="button" aria-label="Device and camera information" title="Device and camera information">i</button>
            </div>
            <div id="deviceInfoPanel" class="device-info hidden"></div>
            <label class="settings-field">
              <span data-i18n="language">Language</span>
              <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="th">ไทย</option>
              </select>
            </label>
            <label class="settings-field">
              <span data-i18n="resolution">Resolution</span>
              <select id="resolutionSelect">
                <option value="1920x1080">1920 x 1080</option>
                <option value="1280x720">1280 x 720</option>
                <option value="1024x768">1024 x 768</option>
              </select>
            </label>
            <label class="settings-field">
              <span data-i18n="ratio">Ratio</span>
              <select id="ratioSelect">
                <option value="9:16">9 : 16</option>
                <option value="3:4">3 : 4</option>
                <option value="4:3">4 : 3</option>
                <option value="1:1">1 : 1</option>
              </select>
            </label>
          </div>
        </div>

        <section class="gallery-panel hidden" id="galleryPanel" aria-label="Image gallery">
          <div class="gallery-card">
            <div class="gallery-header">
              <strong data-i18n="gallery">Gallery</strong>
              <button id="galleryCloseBtn" class="btn btn-icon gallery-close" type="button" aria-label="Close gallery" title="Close gallery">
                <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6 18 18"></path>
                  <path d="M18 6 6 18"></path>
                </svg>
              </button>
            </div>
            <div class="gallery-toolbar">
              <select id="galleryDestinationSelect" aria-label="Gallery folder">
                <option value="Return" data-i18n="returnFolder">Return</option>
                <option value="Outbound" data-i18n="outboundFolder">Outbound</option>
                <option value="Other" data-i18n="otherFolder">Other</option>
              </select>
              <button id="galleryRefreshBtn" class="btn btn-icon gallery-refresh" type="button" aria-label="Refresh gallery" title="Refresh gallery">
                <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 11a8 8 0 0 0-14.9-3"></path>
                  <path d="M4 4v5h5"></path>
                  <path d="M4 13a8 8 0 0 0 14.9 3"></path>
                  <path d="M20 20v-5h-5"></path>
                </svg>
              </button>
            </div>
            <div class="gallery-bulk-actions">
              <button id="gallerySelectAllBtn" class="btn gallery-action" type="button" data-i18n="selectAll">Select all</button>
              <button id="galleryDeleteSelectedBtn" class="btn gallery-action gallery-delete-selected" type="button" disabled data-i18n="deleteSelected">Delete selected</button>
              <span id="gallerySelectionCount" class="gallery-selection-count"></span>
            </div>
            <div class="gallery-status" id="galleryStatus"></div>
            <div class="gallery-grid" id="galleryGrid"></div>
          </div>
        </section>

        <div class="image-viewer hidden" id="imageViewer">
          <button id="imageViewerCloseBtn" class="btn btn-icon image-viewer-close" type="button" aria-label="Close image" title="Close image">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 18 18"></path>
              <path d="M18 6 6 18"></path>
            </svg>
          </button>
          <img id="imageViewerImage" alt="Full size image">
        </div>

        <div class="overlay zoom-overlay" id="zoomOverlay">
          <div class="zoom-control" aria-label="Camera zoom control">
            <button id="zoomValue" class="zoom-toggle" type="button" aria-label="Open zoom control" aria-expanded="false">x1.0</button>
            <div id="zoomSliderPanel" class="zoom-slider-panel hidden">
              <input id="zoomSlider" type="range" min="1" max="1" step="0.1" value="1" aria-label="Zoom">
              <span class="zoom-hint" data-i18n="drag">Drag</span>
            </div>
          </div>
        </div>

        <div class="overlay overlay-preview hidden" id="previewPanel">
          <div class="preview-actions">
            <button id="confirmBtn" class="btn btn-stack btn-confirm" type="button" aria-label="Confirm upload">
              <svg class="stack-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 12 4.2 4.2L19 6.5"></path>
              </svg>
              <span data-i18n="confirm">Confirm</span>
            </button>
            <button id="cancelBtn" class="btn btn-stack btn-cancel" type="button" aria-label="Cancel capture">
              <svg class="stack-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6 18 18"></path>
                <path d="M18 6 6 18"></path>
              </svg>
              <span data-i18n="cancel">Cancel</span>
            </button>
          </div>
          <div class="preview-meta">
            <div id="captureStats">No image</div>
            <div id="serverResult"></div>
          </div>
        </div>

        <div class="overlay overlay-message">
          <div id="liveHint" data-i18n="alignCapture">Align item and tap capture</div>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
  </html>
