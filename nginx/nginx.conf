server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/hdc-server.crt;
    ssl_certificate_key /etc/nginx/certs/hdc-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow multipart overhead on top of Fastify's default 10 MiB file limit.
    client_max_body_size 11m;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pda_upstream pda-camera:8090;
        proxy_pass http://$pda_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
